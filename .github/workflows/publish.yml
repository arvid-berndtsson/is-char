name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (patch/minor/major or exact version like 1.2.3)"
        required: true
        default: "patch"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Determine target version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            CURRENT_VERSION="$(node -p "require('./package.json').version")"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            case "$INPUT_VERSION" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              [0-9]*.[0-9]*.[0-9]*) VERSION="$INPUT_VERSION" ;;
              *) echo "Invalid version input: $INPUT_VERSION"; exit 1 ;;
            esac
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be SemVer (X.Y.Z). Got: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && git show-ref --tags --verify --quiet "refs/tags/v$VERSION"; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare manual release version
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.tag_exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          node - "$VERSION" <<'NODE'
          const fs = require("node:fs");
          const version = process.argv[2];
          for (const file of ["package.json", "deno.json"]) {
            const packageJson = JSON.parse(fs.readFileSync(file, "utf8"));
            packageJson.version = version;
            fs.writeFileSync(file, JSON.stringify(packageJson, null, 2) + "\n");
          }
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Commit and tag manual release
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.tag_exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json deno.json
          git commit -m "chore: release $VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Checkout immutable release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          git fetch origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          REMOTE_SHA="$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)"
          git checkout --detach "v$VERSION"
          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ -z "$REMOTE_SHA" ] || [ "$REMOTE_SHA" != "$LOCAL_SHA" ]; then
            echo "Local tag does not match the remote GitHub tag"
            exit 1
          fi

      - name: Verify version consistency
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node - "$VERSION" <<'NODE'
          const fs = require("node:fs");
          const expected = process.argv[2];
          const files = ["package.json", "package-lock.json", "deno.json"];
          for (const file of files) {
            const actual = JSON.parse(fs.readFileSync(file, "utf8")).version;
            if (actual !== expected) {
              throw new Error(`${file} has version ${actual}, expected ${expected}`);
            }
          }
          NODE

      - name: Check publication status
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if npm view "is-char@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm=false" >> "$GITHUB_OUTPUT"
          fi

          if curl --fail --silent --show-error "https://jsr.io/@arvid/is-char/${VERSION}_meta.json" >/dev/null; then
            echo "jsr=true" >> "$GITHUB_OUTPUT"
          else
            echo "jsr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Verify package import
        run: node --input-type=module -e 'import isChar from "./index.js"; if (!isChar("a")) process.exit(1)'

      - name: Publish to npm
        if: steps.published.outputs.npm != 'true'
        run: npm publish --provenance --access public --registry https://registry.npmjs.org

      - name: Publish to JSR
        if: steps.published.outputs.jsr != 'true'
        run: npx jsr publish
