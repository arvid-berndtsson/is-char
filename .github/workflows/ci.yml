name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Verify package import
        run: node --input-type=module -e 'import isChar from "./index.js"; if (!isChar("a")) process.exit(1)'

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify packed package as a consumer
        shell: bash
        run: |
          PACK_DIR="$RUNNER_TEMP/is-char-pack"
          CONSUMER_DIR="$RUNNER_TEMP/is-char-consumer"
          mkdir -p "$PACK_DIR" "$CONSUMER_DIR"
          npm pack --pack-destination "$PACK_DIR" --json > "$RUNNER_TEMP/is-char-pack.json"
          TARBALL_NAME="$(node -p 'require(process.argv[1])[0].filename' "$RUNNER_TEMP/is-char-pack.json")"
          TARBALL="$PACK_DIR/$TARBALL_NAME"
          npm init --yes --prefix "$CONSUMER_DIR" >/dev/null
          npm install --no-save --prefix "$CONSUMER_DIR" "$TARBALL"
          (
            cd "$CONSUMER_DIR"
            node --input-type=module -e 'import isChar from "is-char"; if (!isChar("a") || isChar("😀")) process.exit(1)'
          )
